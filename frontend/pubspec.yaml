name: frontend
description: "Mero Palo - Hospital Queue Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon — generated from the Mero पालो logo.
# Regenerate after changing the logo with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logos/logo.png"
  android: true
  min_sdk_android: 21
  # Adaptive icon (Android 8+): white background + padded logo so the
  # circular mask never clips the "Mero पालो" wordmark.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo_adaptive_fg.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/logos/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#15825F"
  windows:
    generate: true
    image_path: "assets/logos/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logos/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 900
